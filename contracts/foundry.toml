[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
cbor_metadata = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../config" }]

[fuzz]
runs = 10000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# RPC URLs come from @uzolabs/sdk through script/sdk-env.mjs, never typed here.
[rpc_endpoints]
bot_testnet = "${BOT_TESTNET_RPC_URL}"
bot_mainnet = "${BOT_MAINNET_RPC_URL}"

[fmt]
line_length = 100
