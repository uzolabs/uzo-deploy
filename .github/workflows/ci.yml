name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# bash -eo pipefail, so a failing command piped into tee still fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.8.3
  SLITHER_VERSION: 0.11.6

jobs:
  text:
    name: Text rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No em dashes
        run: |
          # Submodules are gitlinks, so git grep only searches our own files.
          if git grep -nI $'\xe2\x80\x94' -- .; then
            echo "::error::Em dash (U+2014) found. Use a comma, colon, full stop or brackets instead."
            exit 1
          fi
      - name: Never say audited
        run: |
          # "not audited" and "Never say audited" are fine. A bare claim is not.
          if git grep -nIiE '\baudited\b' -- . ':!.github/workflows/ci.yml' | grep -viE 'not audited|unaudited|until an independent audit'; then
            echo "::error::Only say \"tested, not audited\"."
            exit 1
          fi

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: contracts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Lint
        run: forge lint src script -D warnings
      - name: Test and gas snapshot
        # Runs every non-fork test (10,000 fuzz runs, fixed seed). Fails if gas moves more than
        # 1%. Fuzz means can shift slightly when the fuzz dictionary changes.
        run: forge snapshot --check --tolerance 1 --no-match-path "test/fork/*"
      - name: Coverage (100% lines and branches on src)
        env:
          # Coverage builds without the optimizer and is slow. Fewer fuzz runs are enough to
          # reach every line and branch. The full 10,000 runs happen in the step above.
          FOUNDRY_FUZZ_RUNS: 500
        run: |
          forge coverage --no-match-path "test/fork/*" --no-match-coverage "(test|script)/" --report summary | tee coverage.txt
          total=$(grep '| Total' coverage.txt)
          echo "$total"
          count=$(echo "$total" | grep -o '100.00%' | wc -l)
          if [ "$count" -lt 4 ]; then
            echo "::error::Coverage on src must be 100% for lines, statements, branches and functions."
            exit 1
          fi
      - name: Slither
        run: |
          python3 -m pip install --quiet "slither-analyzer==${SLITHER_VERSION}"
          slither . --filter-paths "lib/|test/|script/" --fail-low

  fork:
    name: Testnet fork tests
    runs-on: ubuntu-latest
    needs: contracts
    defaults:
      run:
        shell: bash
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: contracts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Fork tests (testnet only, never mainnet)
        run: |
          # Testnet values only. The --mainnet flag is never used in CI.
          eval "$(node script/sdk-env.mjs)"
          # Fork tests skip when these are unset. In CI that would hide a broken setup.
          test -n "$BOT_TESTNET_RPC_URL" && test -n "$BOT_TESTNET_USDT"
          forge test --match-path "test/fork/*" -vv --summary | tee fork.txt
          if grep -q "skipped" fork.txt && ! grep -q " 0 skipped" fork.txt; then
            echo "::error::Fork tests were skipped."
            exit 1
          fi
